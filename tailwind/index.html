<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja Virtual | Tailwind</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-indigo-700">
    Pular para o conteúdo
  </a>

  <header class="sticky top-0 z-40 bg-indigo-700 text-white shadow">
    <nav class="mx-auto max-w-6xl px-4" aria-label="Menu principal">
      <div class="flex h-16 items-center justify-between">
        <a href="#" class="text-xl font-bold tracking-tight">Loja Virtual</a>

        <button
          id="botaoMenu"
          type="button"
          class="rounded-lg p-2 hover:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-white md:hidden"
          aria-controls="menu"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <ul id="menu" class="absolute inset-x-0 top-16 hidden flex-col gap-1 bg-indigo-700 px-4 pb-4 md:static md:flex md:flex-row md:gap-6 md:p-0">
          <li><a href="#destaques" class="block rounded-lg px-3 py-2 hover:bg-indigo-600 md:p-0 md:hover:bg-transparent md:hover:underline">Destaques</a></li>
          <li><a href="#produtos" class="block rounded-lg px-3 py-2 hover:bg-indigo-600 md:p-0 md:hover:bg-transparent md:hover:underline">Produtos</a></li>
          <li><a href="#frete" class="block rounded-lg px-3 py-2 hover:bg-indigo-600 md:p-0 md:hover:bg-transparent md:hover:underline">Frete</a></li>
          <li><a href="#contato" class="block rounded-lg px-3 py-2 hover:bg-indigo-600 md:p-0 md:hover:bg-transparent md:hover:underline">Contato</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main id="conteudo">
  </main>

  <footer class="mt-12 bg-slate-900 py-6 text-center text-slate-300">
    <p>© 2026 Loja Virtual. Atividade de Tópicos Avançados em Programação.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
